<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings – WhatsApp Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f1117;
            color: #e6e6e6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            color: #00ff88;
            font-size: 22px;
        }

        .phone {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }

        .btn {
            background: #00ff88;
            color: #0f1117;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #00cc6a;
        }

        .btn.secondary {
            background: transparent;
            color: #e6e6e6;
            border: 1px solid #333;
        }

        .btn.secondary:hover {
            background: #1a1d26;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .card {
            background: #1a1d26;
            border: 1px solid #252933;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 16px;
            margin-bottom: 18px;
            color: #00ff88;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #252933;
        }

        .toggle-row:last-child {
            border-bottom: none;
        }

        .toggle-row .label {
            font-size: 14px;
        }

        .toggle-row .hint {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }

        .switch {
            position: relative;
            width: 46px;
            height: 26px;
            background: #252933;
            border-radius: 13px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .switch.on {
            background: #00ff88;
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        .switch.on::after {
            left: 23px;
        }

        .save-btn {
            width: 100%;
            background: #00ff88;
            color: #0f1117;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .save-btn:hover {
            background: #00cc6a;
        }

        .save-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff88;
            color: #0f1117;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .login-required {
            text-align: center;
            padding: 60px 20px;
        }

        .login-required h2 {
            color: #ff4757;
            margin-bottom: 12px;
        }

        .login-required a {
            color: #00ff88;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container" id="app">
        <div class="login-required" id="login-required" style="display:none;">
            <h2>Not logged in</h2>
            <p>Please <a href="/login">login</a> to manage your settings.</p>
        </div>

        <div id="content" style="display:none;">
            <header>
                <div>
                    <h1>⚙️ Bot Settings</h1>
                    <div class="phone" id="phone-display"></div>
                </div>
                <button class="btn secondary" onclick="logout()">Logout</button>
            </header>

            <div class="card">
                <h2>Features</h2>
                <div id="toggles"></div>
                <button class="save-btn" id="save-btn" onclick="saveSettings()">Save Settings</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">✅ Saved</div>

    <script>
        const API = '/api';

        const SETTING_DEFS = [
            { key: 'view_once', label: '📸 Save view-once media', hint: 'Auto-forward view-once photos/videos to your DM' },
            { key: 'auto_react', label: '❤️ Auto-like statuses', hint: 'React to every status from your contacts' },
            { key: 'auto_presence', label: '✍️ Show typing/recording', hint: 'Display typing indicator while bot processes' },
            { key: 'anti_delete', label: '🗑️ Save deleted messages', hint: 'Keep a copy of messages before they are deleted' },
            { key: 'ai_chat', label: '🤖 AI chat replies', hint: 'Enable AI-powered auto-replies' },
        ];

        let currentSettings = {};
        let phone = '';
        let pin = '';

        async function load() {
            phone = localStorage.getItem('phone') || '';
            pin = localStorage.getItem('pin') || '';

            if (!phone || !pin) {
                document.getElementById('login-required').style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API}/auth/settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, pin })
                });
                const data = await res.json();

                if (!data.ok) {
                    localStorage.removeItem('phone');
                    localStorage.removeItem('pin');
                    document.getElementById('login-required').style.display = 'block';
                    return;
                }

                currentSettings = data.settings || {};
                document.getElementById('phone-display').textContent = '+' + phone;
                document.getElementById('content').style.display = 'block';
                renderToggles();
            } catch (e) {
                alert('Failed to load settings: ' + e.message);
            }
        }

        function renderToggles() {
            const container = document.getElementById('toggles');
            container.innerHTML = SETTING_DEFS.map(def => {
                const val = currentSettings[def.key] === true;
                return `
      <div class="toggle-row">
        <div>
          <div class="label">${def.label}</div>
          <div class="hint">${def.hint}</div>
        </div>
        <div class="switch ${val ? 'on' : ''}" data-key="${def.key}" onclick="toggle(this)"></div>
      </div>
    `;
            }).join('');
        }

        function toggle(el) {
            el.classList.toggle('on');
        }

        async function saveSettings() {
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const newSettings = {};
            document.querySelectorAll('.switch').forEach(el => {
                newSettings[el.dataset.key] = el.classList.contains('on');
            });

            try {
                const res = await fetch(`${API}/auth/settings/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, pin, settings: newSettings })
                });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error || 'Failed to save');

                currentSettings = newSettings;
                showToast('✅ Settings saved');
            } catch (e) {
                alert('Save failed: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Settings';
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function logout() {
            localStorage.removeItem('phone');
            localStorage.removeItem('pin');
            location.href = '/login';
        }

        load();
    </script>
</body>

</html>
