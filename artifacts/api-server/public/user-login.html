<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – NovaBot</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>

    <header class="site-header">
        <div class="inner">
            <a class="brand" href="/">
                <span class="logo">🤖</span>
                <span>NovaBot</span>
            </a>
            <nav class="site-nav">
                <a href="/">🔗 Link</a>
                <a href="/user">💬 My Chats</a>
                <a href="/my-files">📁 My Files</a>
                <a href="/login" class="active">🔑 Login</a>
                <a href="/admin">⚙️ Admin</a>
            </nav>
        </div>
    </header>

    <main class="page narrow">
        <div class="panel">
            <div class="page-head">
                <h1>🔑 Sign in</h1>
                <p class="muted">Access your bot settings and saved media.</p>
            </div>

            <div class="tabs">
                <button class="tab active" id="tab-login" onclick="switchTab('login')">Login</button>
                <button class="tab" id="tab-register" onclick="switchTab('register')">Register</button>
            </div>

            <div style="margin-top:20px;">
                <div class="field">
                    <label class="lbl">Phone Number (with country code)</label>
                    <input type="tel" id="phone" placeholder="e.g., 2348103077073" />
                </div>
                <div class="field">
                    <label class="lbl">4-digit PIN</label>
                    <input type="password" id="pin" maxlength="4" inputmode="numeric" placeholder="••••" />
                </div>
                <button class="btn block" id="submit-btn" onclick="submit()">Login</button>
                <div id="error" class="error"></div>
            </div>
        </div>

        <p class="muted" style="text-align:center;margin-top:20px;font-size:12.5px;">
            <a href="/">🔗 Link WhatsApp</a> · <a href="/my-files">📁 My files</a> · <a href="/admin">⚙️ Admin panel</a>
        </p>
    </main>

    <script>
        const API = '/api';
        let mode = 'login';

        function switchTab(newMode) {
            mode = newMode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('submit-btn').textContent = mode === 'login' ? 'Login' : 'Register';
            document.getElementById('error').style.display = 'none';
        }

        async function submit() {
            const phone = document.getElementById('phone').value.trim();
            const pin = document.getElementById('pin').value.trim();
            const errEl = document.getElementById('error');
            const btn = document.getElementById('submit-btn');

            errEl.style.display = 'none';

            if (!phone || !pin) {
                errEl.textContent = 'Enter your phone number and PIN.';
                errEl.style.display = 'block';
                return;
            }
            if (!/^\d{4}$/.test(pin)) {
                errEl.textContent = 'PIN must be exactly 4 digits.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = mode === 'login' ? 'Logging in...' : 'Creating account...';

            try {
                const res = await fetch(`${API}/auth/${mode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, pin })
                });
                const data = await res.json();

                if (!data.ok) {
                    throw new Error(data.error || 'Something went wrong');
                }

                if (mode === 'register') {
                    // After register, auto-login
                    switchTab('login');
                    btn.disabled = false;
                    btn.textContent = 'Login';
                    errEl.textContent = '✅ Account created. Please login.';
                    errEl.style.background = 'var(--accent-soft)';
                    errEl.style.borderColor = 'var(--accent)';
                    errEl.style.color = 'var(--accent)';
                    errEl.style.display = 'block';
                    return;
                }

                // Login successful → go to settings page with credentials
                localStorage.setItem('phone', phone);
                localStorage.setItem('pin', pin);
                location.href = '/user-settings';

            } catch (e) {
                errEl.textContent = e.message;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = mode === 'login' ? 'Login' : 'Register';
            }
        }
    </script>
</body>

</html>
