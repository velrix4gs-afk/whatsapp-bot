<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Files – NovaBot</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>

    <header class="site-header">
        <div class="inner">
            <a class="brand" href="/">
                <span class="logo">🤖</span>
                <span>NovaBot</span>
            </a>
            <nav class="site-nav">
                <a href="/">🔗 Link</a>
                <a href="/user">💬 My Chats</a>
                <a href="/my-files" class="active">📁 My Files</a>
                <a href="/login">🔑 Login</a>
                <a href="/admin">⚙️ Admin</a>
            </nav>
        </div>
    </header>

    <main class="page">

        <!-- Login view -->
        <section id="login-view" class="page narrow" style="margin:0 auto;">
            <div class="panel">
                <div class="page-head">
                    <h1>📁 My Files</h1>
                    <p class="muted">Login with your WhatsApp number and PIN</p>
                </div>

                <div class="field">
                    <label class="lbl">Phone number (with country code)</label>
                    <input type="tel" id="phone" placeholder="e.g., 2348103077073" />
                </div>
                <div class="field">
                    <label class="lbl">4-digit PIN</label>
                    <input type="password" id="pin" maxlength="4" inputmode="numeric" placeholder="••••" />
                </div>
                <button class="btn block" id="login-btn" onclick="login()">Login</button>
                <div class="error" id="login-error" style="display:none;"></div>
            </div>
        </section>

        <!-- Files view -->
        <section id="files-view" style="display:none;">
            <div class="page-head">
                <h1>📁 My Saved Files</h1>
                <p class="muted" id="phone-display"></p>
            </div>

            <div class="row" style="margin-bottom:4px;">
                <button class="btn secondary sm" onclick="refresh()">🔄 Refresh</button>
                <button class="btn ghost sm" onclick="logout()">Logout</button>
            </div>

            <div class="file-grid" id="files-grid"></div>
        </section>
    </main>

    <script>
        const API = '/api';

        function fmtSize(bytes) {
            if (!bytes) return "—";
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            return (bytes / 1024 / 1024).toFixed(2) + " MB";
        }

        function fmtDate(iso) {
            if (!iso) return "—";
            const d = new Date(iso);
            return d.toLocaleString();
        }

        async function login() {
            const phone = document.getElementById('phone').value.trim();
            const pin = document.getElementById('pin').value.trim();
            const errEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            errEl.style.display = 'none';

            if (!phone || !pin) {
                errEl.textContent = 'Enter your phone number and PIN.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                localStorage.setItem('phone', phone);
                localStorage.setItem('pin', pin);

                const res = await fetch(`${API}/user/files`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, pin }),
                });
                const data = await res.json();

                if (!data.ok) throw new Error(data.error || 'Login failed');

                showFiles(data.files, phone);
            } catch (e) {
                errEl.textContent = e.message;
                errEl.style.display = 'block';
                localStorage.removeItem('phone');
                localStorage.removeItem('pin');
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        async function refresh() {
            const phone = localStorage.getItem('phone');
            const pin = localStorage.getItem('pin');
            if (!phone || !pin) return logout();

            const grid = document.getElementById('files-grid');
            grid.innerHTML = '<div class="loading">Loading…</div>';

            try {
                const res = await fetch(`${API}/user/files`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, pin }),
                });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error);
                renderFiles(data.files);
            } catch (e) {
                grid.innerHTML = `<div class="empty"><h2>Error</h2><p>${escapeHtml(e.message)}</p></div>`;
            }
        }

        function showFiles(files, phone) {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('files-view').style.display = 'block';
            document.getElementById('phone-display').textContent = '+' + phone.replace(/\D/g, '');
            renderFiles(files);
        }

        function renderFiles(files) {
            const grid = document.getElementById('files-grid');

            if (!files || files.length === 0) {
                grid.innerHTML = '<div class="empty"><h2>No files yet</h2><p>Save a view-once or status to see files here.</p></div>';
                return;
            }

            grid.innerHTML = files.map(f => {
                const type = f.type || 'file';
                let preview = '<div class="icon">📄</div>';
                if (type === 'image') {
                    preview = `<img src="${f.url}" loading="lazy" alt="${escapeHtml(f.name)}" onerror="this.parentElement.innerHTML='<div class=\\'icon\\'>🖼️</div>'" />`;
                } else if (type === 'video') {
                    preview = `<video src="${f.url}" muted preload="metadata"></video>`;
                } else if (type === 'audio') {
                    preview = `<audio controls preload="none" src="${f.url}"></audio>`;
                }

                const name = f.name.length > 30 ? f.name.slice(0, 27) + '...' : f.name;

                return `
      <div class="file-card">
        <div class="preview">${preview}</div>
        <div class="info">
          <div class="name">${escapeHtml(name)}</div>
          <div class="meta">${fmtSize(f.size)} • ${fmtDate(f.created_at)}</div>
          <div class="actions">
            <a href="${f.url}" target="_blank" rel="noopener">View</a>
            <a href="${f.url}" download class="secondary">⬇</a>
            <button class="btn danger sm" type="button" data-name="${escapeHtml(f.name)}" onclick="deleteFile(this.dataset.name)">🗑</button>
          </div>
        </div>
      </div>
    `;
            }).join('');
        }

        async function deleteFile(name) {
            if (!name) return;
            if (!confirm('Delete "' + name + '"? This cannot be undone.')) return;
            const phone = localStorage.getItem('phone');
            const pin = localStorage.getItem('pin');
            try {
                const res = await fetch(`${API}/user/files/delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, pin, name }),
                });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error || 'Delete failed');
                refresh();
            } catch (e) {
                alert(e.message);
            }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function logout() {
            localStorage.removeItem('phone');
            localStorage.removeItem('pin');
            location.reload();
        }

        // Auto-login if saved
        (function () {
            const phone = localStorage.getItem('phone');
            const pin = localStorage.getItem('pin');
            if (phone && pin) {
                document.getElementById('phone').value = phone;
                document.getElementById('pin').value = pin;
                login();
            }
        })();
    </script>
</body>

</html>
